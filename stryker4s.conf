// Stryker4s mutation testing — see https://stryker-mutator.io/docs/stryker4s/configuration/
//
// Run with `sbt stryker`. Reports land in target/stryker4s-report/<timestamp>/.
//
// This is a diagnostic, not a gate: `break = 0` means the build never fails on the
// mutation score. Mutation testing answers a question statement coverage cannot —
// whether a test *asserts* a behaviour or merely executes it — and the answer needs a
// human to read it, because a surviving mutant may be a genuine gap or an equivalent
// mutant that no test could ever kill.
stryker4s {

  // The whole of src/main/scala. Scoping to individual files saves almost nothing:
  // Stryker4s compiles all mutants into one artifact (mutation switching) and then
  // flips between them with an environment variable, so the cost is two compiles plus
  // sbt start-up plus one test-suite run per mutant batch. Measured on Visitor, whose
  // suite runs in about a second, 2 mutants cost 35s and 113 cost 50s. Gryphon's suite
  // is slower, so here the mutant phase does scale with the mutant count — see the
  // numbers in the adoption issue.
  mutate = [
    "src/main/scala/**/*.scala"
  ]

  // StringLiteral rewrites every string literal to "". On the Phasmid codebases that
  // means the text of `require` failure messages, exception messages and log output,
  // which no test asserts and none should. On Visitor it accounted for 11 of 17
  // survivors and drowned the findings that mattered. Excluding it leaves the mutators
  // that change behaviour rather than diagnostics.
  excluded-mutations = ["StringLiteral"]

  reporters = ["console", "html"]

  thresholds {
    high = 80
    low = 60
    break = 0
  }
}
