# CircleCI configuration for Gryphon (the standard Phasmid template)
#
# Check https://circleci.com/docs/configuration-reference/ for more details
#
version: 2.1

jobs:
  build:
    docker:
      # cimg/openjdk ships Maven and Gradle but not sbt, so sbt is installed below
      - image: cimg/openjdk:21.0

    working_directory: ~/repo

    environment:
      # Customize the JVM maximum heap limit
      JVM_OPTS: -Xmx3200m
      TERM: dumb

    steps:
      - checkout

      - run:
          name: Install sbt (version pinned in project/build.properties)
          command: |
            SBT_VERSION=$(sed -n 's/^sbt.version=//p' project/build.properties)
            curl -fsSL --retry 3 "https://github.com/sbt/sbt/releases/download/v${SBT_VERSION}/sbt-${SBT_VERSION}.tgz" | tar -xz -C ~
            echo 'export PATH="$HOME/sbt/bin:$PATH"' >> "$BASH_ENV"

      # Download and cache dependencies
      - restore_cache:
          keys:
            - v2-dependencies-{{ checksum "build.sbt" }}-{{ checksum "project/build.properties" }}-{{ checksum "project/plugins.sbt" }}
            # fallback to using the latest cache if no exact match is found
            - v2-dependencies-

      - run:
          name: Compile
          command: cat /dev/null | sbt Test/compile Scale/compile

      - save_cache:
          paths:
            - ~/.ivy2/cache
            - ~/.sbt
            - ~/.cache/coursier
          key: v2-dependencies-{{ checksum "build.sbt" }}-{{ checksum "project/build.properties" }}-{{ checksum "project/plugins.sbt" }}

      - run:
          name: Test
          command: cat /dev/null | sbt test

      # The scale suite: 1000-vertex graphs, in its own sbt configuration so that `sbt test`
      # above stays fast (see #165). Its own step, so that a failure here is distinguishable at
      # a glance from an ordinary test failure -- these exercise a different thing.
      #
      # `no_output_timeout` is raised because MST.prim alone takes about six seconds on the
      # sparse graph and CircleCI's containers are slower than a laptop; the default 10 minutes
      # would be close enough to matter if anything else regressed. See #164.
      - run:
          name: Scale tests
          command: cat /dev/null | sbt Scale/test
          no_output_timeout: 20m

      # Binary compatibility with the last release (MiMa: see previousRelease in build.sbt)
      - run:
          name: Binary compatibility
          command: cat /dev/null | sbt mimaReportBinaryIssues

      # Generate Scaladoc and the Java façade's Javadoc. Both are published to GitHub Pages, and
      # building them here catches broken doc comments: javaApiDoc runs javadoc with -Xdoclint, so
      # a malformed tag or a dead @link fails the build rather than silently degrading the docs.
      - run:
          name: Doc
          command: cat /dev/null | sbt doc javaApiDoc

      - store_test_results:
          path: target/test-reports

      # Coverage, reported but not enforced. It starts with clean, because the earlier steps' classes aren't instrumented.
      - run:
          name: Coverage
          command: cat /dev/null | sbt clean coverage test coverageReport

      - store_artifacts:
          path: target/scala-3.9.0/scoverage-report
          destination: coverage

      # Send coverage to Codacy. The account API token, CODACY_API_TOKEN, comes from the "codacy" context in CircleCI; without it the step does nothing.
      - run:
          name: Upload coverage to Codacy
          command: |
            if [ -n "${CODACY_API_TOKEN:-}" ]; then
              export CODACY_ORGANIZATION_PROVIDER=gh CODACY_USERNAME=rchillyard CODACY_PROJECT_NAME=Gryphon
              bash <(curl -Ls https://coverage.codacy.com/get.sh) report -r target/scala-3.9.0/coverage-report/cobertura.xml || echo "The upload to Codacy failed (coverage isn't enforced, so the build carries on)"
            else
              echo "CODACY_API_TOKEN isn't in the codacy context, so coverage isn't sent to Codacy"
            fi

workflows:
  build:
    jobs:
      - build:
          # The codacy context holds CODACY_API_TOKEN, for the coverage upload
          context: codacy
